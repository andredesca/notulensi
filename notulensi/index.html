<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notulensi Rapat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f6f8;--surface:#fff;--ink:#14243a;--muted:#5d6b7c;--line:#d8e0e8;--accent:#0f6e6a;--accent-ink:#fff;--rec:#c8372d;--side:#14243a;--side-ink:#dbe5ee}
@media(prefers-color-scheme:dark){:root{--bg:#0e1621;--surface:#162232;--ink:#e6edf4;--muted:#92a2b4;--line:#27374b;--accent:#3cb8b0;--accent-ink:#06201f;--rec:#ff6a5e;--side:#0a111a}}
*{box-sizing:border-box}
html,body{margin:0}
body{font:16px/1.55 Figtree,system-ui,sans-serif;background:var(--bg);color:var(--ink)}
.app{display:grid;grid-template-columns:290px 1fr;min-height:100vh}
aside{background:var(--side);color:var(--side-ink);padding:20px 16px;display:flex;flex-direction:column;gap:14px;position:sticky;top:0;height:100vh;overflow:auto}
aside h1{font-size:20px;margin:0}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 14px}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
button.rec{background:var(--rec);color:#fff;border-color:var(--rec);font-weight:700}
button:disabled{opacity:.55;cursor:wait}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
aside button.primary{width:100%}
.list{display:flex;flex-direction:column;gap:4px;overflow:auto}
.item{background:none;border:0;color:inherit;text-align:left;padding:9px 10px;border-radius:8px;width:100%}
.item:hover,.item.on{background:rgba(255,255,255,.12)}
.item b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item small{opacity:.7}
main{padding:28px clamp(16px,4vw,48px);max-width:900px;width:100%}
.empty{color:var(--muted);padding:60px 0}
.fields{display:grid;grid-template-columns:1fr 190px;gap:14px}
.fields .wide{grid-column:1/-1}
label{display:block;font-size:14px;color:var(--muted);margin-bottom:4px}
input,textarea{font:inherit;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
#title{font-size:24px;font-weight:700}
textarea{min-height:260px;resize:vertical;line-height:1.6}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:12px 0}
.status{color:var(--muted);font-size:14px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--rec);margin-right:6px;animation:p 1.2s infinite}
@keyframes p{50%{opacity:.25}}
@media(prefers-reduced-motion:reduce){.dot{animation:none}}
#interim{color:var(--muted);font-style:italic;min-height:1.5em;font-size:15px}
section.sum{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:8px;padding:6px 22px 18px;margin-top:22px}
section.sum h2{font-size:18px;margin:18px 0 6px}
section.sum ul{margin:0;padding-left:20px}
section.sum li{margin:4px 0}
.src{font-size:13px;color:var(--muted)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;display:none;max-width:90vw}
@media(max-width:760px){.app{grid-template-columns:1fr}aside{position:static;height:auto;max-height:260px}.fields{grid-template-columns:1fr}}
@media print{aside,.bar,.toast,textarea{display:none}.app{display:block}#printNotes{display:block!important;white-space:pre-wrap}}
#printNotes{display:none}
</style>
</head>
<body>
<div class="app">
  <aside>
    <h1>Notulensi Rapat</h1>
    <button class="primary" id="new">Rapat baru</button>
    <div class="list" id="list"></div>
  </aside>
  <main id="main"></main>
</div>
<div class="toast" id="toast" role="status"></div>

<template id="editor">
  <div class="fields">
    <div class="wide"><label for="title">Judul rapat</label><input id="title" placeholder="Contoh: Rapat koordinasi mingguan"></div>
    <div><label for="people">Peserta rapat (pisahkan dengan koma)</label><input id="people" placeholder="Budi, Sari, Pak Anton"></div>
    <div><label for="date">Tanggal</label><input id="date" type="date"></div>
  </div>
  <div class="bar">
    <button class="rec" id="recBtn">Mulai rekam</button>
    <span class="status" id="recStatus">Ketik catatan di bawah, atau rekam untuk dikonversi menjadi teks.</span>
  </div>
  <label for="notes">Catatan / transkrip</label>
  <textarea id="notes" placeholder="Tulis poin pembahasan, atau mulai rekam…"></textarea>
  <div id="interim" aria-live="polite"></div>
  <div class="bar">
    <button class="primary" id="sumBtn">Ringkas hasil rapat</button>
    <button id="copyBtn">Salin</button>
    <button id="dlBtn">Unduh .md</button>
    <button id="printBtn">Cetak / PDF</button>
    <button id="delBtn">Hapus rapat</button>
  </div>
  <div id="audioOut" class="bar"></div>
  <div id="summary"></div>
  <div id="printNotes"></div>
</template>

<script>
const $ = s => document.querySelector(s);
let db = [], cur = null, recording = false, rec, mr, stream, chunks = [], timer, t0;

try { db = JSON.parse(localStorage.getItem('notulensi') || '[]'); } catch {}
const persist = () => { try { localStorage.setItem('notulensi', JSON.stringify(db)); } catch { toast('Penyimpanan browser penuh atau dinonaktifkan.'); } renderList(); };
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',3500)}
const fmtDate = d => d ? new Date(d+'T00:00').toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'}) : '';

function renderList(){
  $('#list').innerHTML = '';
  db.forEach(m => {
    const b = document.createElement('button');
    b.className = 'item' + (cur && cur.id === m.id ? ' on' : '');
    const t = document.createElement('b'); t.textContent = m.title || 'Rapat tanpa judul';
    const s = document.createElement('small'); s.textContent = fmtDate(m.date);
    b.append(t, s); b.onclick = () => openMeeting(m.id);
    $('#list').append(b);
  });
}

function newMeeting(){
  const m = {id:Date.now().toString(36), title:'', date:new Date().toISOString().slice(0,10), people:'', notes:'', summary:null};
  db.unshift(m); persist(); openMeeting(m.id); $('#title').focus();
}

function openMeeting(id){
  if (recording) stopRec();
  cur = db.find(m => m.id === id);
  const main = $('#main');
  if (!cur){ main.innerHTML = '<p class="empty">Belum ada rapat. Pilih “Rapat baru” untuk mulai mencatat.</p>'; renderList(); return; }
  main.replaceChildren($('#editor').content.cloneNode(true));
  ['title','people','date','notes'].forEach(k => {
    const el = $('#'+k); el.value = cur[k];
    el.oninput = () => { cur[k] = el.value; persist(); };
  });
  $('#recBtn').onclick = () => recording ? stopRec() : startRec();
  $('#sumBtn').onclick = summarize;
  $('#copyBtn').onclick = () => navigator.clipboard.writeText(toMarkdown()).then(() => toast('Tersalin.'), () => toast('Gagal menyalin.'));
  $('#dlBtn').onclick = () => download(new Blob([toMarkdown()],{type:'text/markdown'}), slug()+'.md');
  $('#printBtn').onclick = () => { $('#printNotes').textContent = cur.notes; window.print(); };
  $('#delBtn').onclick = () => { if (confirm('Hapus rapat ini? Tindakan ini tidak bisa dibatalkan.')){ db = db.filter(m => m !== cur); persist(); openMeeting(db[0]?.id); } };
  renderSummary(); renderList();
}

/* ---------- Rekaman ---------- */
function append(t){ if(!t) return; const n=$('#notes'); n.value += (n.value && !n.value.endsWith('\n') ? '\n' : '') + t; cur.notes = n.value; persist(); }

async function startRec(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  try { stream = await navigator.mediaDevices.getUserMedia({audio:true}); }
  catch { return toast('Izin mikrofon ditolak. Aktifkan mikrofon di pengaturan browser.'); }
  recording = true; chunks = [];
  if (window.MediaRecorder){ mr = new MediaRecorder(stream); mr.ondataavailable = e => chunks.push(e.data); mr.onstop = saveAudio; mr.start(); }
  if (SR){
    rec = new SR(); rec.lang = 'id-ID'; rec.continuous = true; rec.interimResults = true;
    rec.onresult = e => { let im=''; for(let i=e.resultIndex;i<e.results.length;i++){ const r=e.results[i]; if(r.isFinal) append(r[0].transcript.trim()); else im += r[0].transcript; } $('#interim').textContent = im; };
    rec.onend = () => { if (recording) try { rec.start(); } catch {} };
    rec.start();
  } else toast('Browser ini tidak bisa mengubah suara menjadi teks. Pakai Chrome atau Edge; audio tetap direkam.');
  $('#recBtn').textContent = 'Berhenti rekam'; $('#audioOut').innerHTML = '';
  t0 = Date.now();
  timer = setInterval(() => { const s = Math.floor((Date.now()-t0)/1000); $('#recStatus').innerHTML = '<span class="dot"></span>Merekam ' + String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0'); }, 500);
}
function stopRec(){
  recording = false; clearInterval(timer);
  try { rec && rec.stop(); } catch {}
  if (mr && mr.state !== 'inactive') mr.stop();
  stream && stream.getTracks().forEach(t => t.stop());
  const b = $('#recBtn'); if (b){ b.textContent = 'Mulai rekam'; $('#recStatus').textContent = 'Rekaman selesai. Periksa teks, lalu ringkas.'; $('#interim').textContent = ''; }
}
function saveAudio(){
  const blob = new Blob(chunks, {type: mr.mimeType || 'audio/webm'}), url = URL.createObjectURL(blob);
  const out = $('#audioOut'); if (!out) return;
  const a = document.createElement('audio'); a.controls = true; a.src = url;
  const d = document.createElement('button'); d.textContent = 'Unduh audio'; d.onclick = () => download(blob, slug()+'.webm');
  out.replaceChildren(a, d);
}

/* ---------- Ringkasan ---------- */
async function summarize(){
  if (cur.notes.trim().length < 20) return toast('Tulis atau rekam catatan dulu.');
  const btn = $('#sumBtn'); btn.disabled = true; btn.textContent = 'Meringkas…';
  let s;
  try {
    const r = await fetch('/.netlify/functions/summarize', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({title:cur.title,date:cur.date,people:cur.people,notes:cur.notes})});
    if (!r.ok) throw 0; s = await r.json(); s.source = 'AI';
  } catch { s = localSummary(cur.notes); s.source = 'otomatis (tanpa AI)'; }
  cur.summary = s; persist(); btn.disabled = false; btn.textContent = 'Ringkas ulang'; renderSummary();
}
function localSummary(t){
  const sents = (t.replace(/\s+/g,' ').match(/[^.!?\n]+[.!?]?/g) || []).map(s=>s.trim()).filter(s=>s.length>25);
  const stop = new Set('yang dan di ke dari untuk dengan ini itu pada adalah akan juga kita saya kami ada tidak bisa sudah karena atau dalam sebagai oleh agar lebih'.split(' '));
  const words = s => s.toLowerCase().match(/\p{L}{3,}/gu) || [], f = {};
  words(t).forEach(w => { if(!stop.has(w)) f[w] = (f[w]||0)+1; });
  const score = s => words(s).reduce((a,w)=>a+(f[w]||0),0)/Math.sqrt(s.length);
  const top = [...sents.keys()].sort((a,b)=>score(sents[b])-score(sents[a])).slice(0,4).sort((a,b)=>a-b).map(i=>sents[i]);
  return {
    ringkasan: top.join(' ') || sents.slice(0,3).join(' '),
    keputusan: sents.filter(s=>/diputuskan|disepakati|sepakat|keputusan|ditetapkan/i.test(s)).slice(0,6),
    tindak_lanjut: sents.filter(s=>/harus|tolong|tindak lanjut|paling lambat|deadline|tenggat|ditugaskan|bertugas|\bpic\b/i.test(s)).slice(0,6)
  };
}
function renderSummary(){
  const box = $('#summary'); box.replaceChildren(); const s = cur.summary; if (!s) return;
  const sec = document.createElement('section'); sec.className = 'sum';
  const add = (h, content) => { const e = document.createElement('h2'); e.textContent = h; sec.append(e);
    if (Array.isArray(content)){ const ul = document.createElement('ul'); (content.length ? content : ['Tidak ada.']).forEach(x => { const li = document.createElement('li'); li.textContent = x; ul.append(li); }); sec.append(ul); }
    else { const p = document.createElement('p'); p.textContent = content || 'Tidak ada.'; sec.append(p); } };
  add('Ringkasan', s.ringkasan); add('Keputusan', s.keputusan); add('Tindak lanjut', s.tindak_lanjut);
  const src = document.createElement('p'); src.className = 'src'; src.textContent = 'Dibuat secara ' + s.source + '. Periksa kembali sebelum dibagikan.'; sec.append(src);
  box.append(sec);
}

/* ---------- Ekspor ---------- */
function slug(){ return (cur.title || 'notulensi').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') + '-' + cur.date; }
function download(blob, name){ const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); }
function toMarkdown(){
  const s = cur.summary, list = a => (a && a.length ? a.map(x=>'- '+x).join('\n') : '- Tidak ada.');
  return `# ${cur.title || 'Notulensi Rapat'}\n\n**Tanggal:** ${fmtDate(cur.date)}\n**Peserta:** ${cur.people || '-'}\n\n` +
    (s ? `## Ringkasan\n${s.ringkasan}\n\n## Keputusan\n${list(s.keputusan)}\n\n## Tindak lanjut\n${list(s.tindak_lanjut)}\n\n` : '') +
    `## Catatan\n${cur.notes}\n`;
}

$('#new').onclick = newMeeting;
renderList(); openMeeting(db[0]?.id);
</script>
</body>
</html>
